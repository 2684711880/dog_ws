controller_manager:
  ros__parameters:
    update_rate: 200

    forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

forward_position_controller:
  ros__parameters:
    joints:
      - LF_Joint_1
      - LF_Joint_2
      - LF_Joint_3
      - RF_Joint_1
      - RF_Joint_2
      - RF_Joint_3
      - LB_Joint_1
      - LB_Joint_2
      - LB_Joint_3
      - RB_Joint_1
      - RB_Joint_2
      - RB_Joint_3
    interface_name: position
